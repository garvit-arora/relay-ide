[package]
name = "relay-ide"
version = "0.4.0"
description = "Relay collaborative multi-agent desktop IDE"
authors = ["Relay"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "relay_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
