<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0f" />
  <title>Relay IDE</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #edf2ff; overflow: hidden; background: radial-gradient(circle at 50% 25%, rgba(92, 101, 255, .18), transparent 34%), #07090d; }
    .noise { position: fixed; inset: 0; opacity: .15; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.1'/%3E%3C/svg%3E"); }
    main { min-height: 100vh; display: grid; place-items: center; position: relative; }
    .card { width: min(520px, calc(100vw - 48px)); padding: 42px; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; background: rgba(14,17,25,.82); box-shadow: 0 34px 100px rgba(0,0,0,.54); backdrop-filter: blur(24px); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; font-weight: 800; font-size: 20px; background: linear-gradient(135deg,#8087ff,#5a48ee); box-shadow: 0 14px 36px rgba(91,75,240,.35); }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .sub { color:#8790a6; font-size: 12px; margin-top: 3px; }
    .loader { height: 4px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin: 22px 0 18px; }
    .loader::after { content:""; display:block; width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#696eff,#a48cff); animation:move 1.25s ease-in-out infinite alternate; box-shadow:0 0 18px #7672ff; }
    @keyframes move { from { transform:translateX(-15%); } to { transform:translateX(155%); } }
    .status { color:#c9d0e3; font-size:14px; margin:0; }
    .steps { display:flex; gap:8px; margin-top:22px; }
    .step { flex:1; height:3px; border-radius:99px; background:#272c38; }
    .step.on { background:#747aff; box-shadow:0 0 12px rgba(116,122,255,.4); }
    .hint { margin:20px 0 0; font-size:12px; color:#676f82; line-height:1.55; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <main>
    <section class="card">
      <div class="brand"><div class="mark">R</div><div><h1>Relay IDE</h1><div class="sub">Code together. Ship together.</div></div></div>
      <p class="status" id="status">Starting local workspace services…</p>
      <div class="loader"></div>
      <div class="steps"><i class="step on"></i><i class="step on"></i><i class="step"></i></div>
      <p class="hint">Launching the real Code-OSS workbench, local extension host, terminal, Git, and Relay's persistent collaboration backend.</p>
    </section>
  </main>
</body>
</html>
